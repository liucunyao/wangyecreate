<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="智岗匹配是一款本地运行的岗位匹配工具，可按学历、专业、城市、薪资、技能和职业偏好推荐合适岗位。"
    />
    <title>智岗匹配</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="profile-panel" aria-label="候选人条件">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div>
            <p class="eyebrow">Career Fit Engine</p>
            <h1>智岗匹配</h1>
          </div>
        </div>

        <form id="profileForm" class="profile-form">
          <div class="field-group">
            <label for="education">最高学历</label>
            <select id="education" name="education">
              <option value="associate">大专</option>
              <option value="bachelor" selected>本科</option>
              <option value="master">硕士</option>
              <option value="doctor">博士</option>
            </select>
          </div>

          <div class="field-group">
            <label for="major">专业方向</label>
            <select id="major" name="major"></select>
          </div>

          <div class="field-grid">
            <div class="field-group">
              <label for="experience">工作年限</label>
              <input id="experience" name="experience" type="number" min="0" max="30" value="2" />
            </div>
            <div class="field-group">
              <label for="city">期望城市</label>
              <select id="city" name="city"></select>
            </div>
          </div>

          <div class="field-grid">
            <div class="field-group">
              <label for="salaryMin">期望最低月薪</label>
              <select id="salaryMin" name="salaryMin">
                <option value="0">不限</option>
                <option value="8">8K+</option>
                <option value="12">12K+</option>
                <option value="18">18K+</option>
                <option value="25">25K+</option>
                <option value="35">35K+</option>
              </select>
            </div>
            <div class="field-group">
              <label for="industry">目标行业</label>
              <select id="industry" name="industry"></select>
            </div>
          </div>

          <fieldset>
            <legend>技能标签</legend>
            <div class="tag-picker" id="skillPicker"></div>
          </fieldset>

          <fieldset>
            <legend>职业偏好</legend>
            <div class="preference-grid" id="preferencePicker"></div>
          </fieldset>

          <div class="live-status" aria-live="polite">
            <span aria-hidden="true"></span>
            <p>条件变化后自动刷新匹配结果</p>
          </div>
        </form>
      </aside>

      <section class="results-panel" aria-label="匹配岗位">
        <header class="results-header">
          <div>
            <p class="eyebrow">Personalized Recommendation</p>
            <h2>推荐岗位</h2>
          </div>
          <div class="summary-card">
            <span id="matchCount">0</span>
            <p>高匹配岗位</p>
          </div>
        </header>

        <section class="insight-strip" aria-label="匹配画像">
          <div>
            <strong>匹配画像</strong>
            <p id="profileInsight">正在分析学历、专业、经验与技能组合。</p>
          </div>
          <div class="meter" aria-label="整体匹配度">
            <span id="overallMeter"></span>
          </div>
        </section>

        <section class="stats-grid" aria-label="实时筛选数据">
          <div class="stat-card">
            <span id="totalJobs">0</span>
            <p>岗位样本</p>
          </div>
          <div class="stat-card">
            <span id="hardMatchJobs">0</span>
            <p>硬性通过</p>
          </div>
          <div class="stat-card">
            <span id="visibleJobs">0</span>
            <p>当前展示</p>
          </div>
          <div class="stat-card">
            <span id="averageScore">0%</span>
            <p>平均匹配</p>
          </div>
        </section>

        <div class="filter-readout" id="filterReadout" aria-live="polite"></div>

        <div class="toolbar" aria-label="岗位筛选">
          <div class="segmented-control" id="sortControl" role="group" aria-label="排序方式">
            <button type="button" data-sort="score" class="active">匹配度</button>
            <button type="button" data-sort="salary">薪资</button>
            <button type="button" data-sort="experience">经验</button>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="keywordSearch" type="search" placeholder="搜索岗位、公司、城市或技能" />
          </label>
        </div>

        <div id="jobList" class="job-list"></div>
      </section>
    </main>

    <template id="jobCardTemplate">
      <article class="job-card">
        <div class="job-main">
          <div>
            <p class="company"></p>
            <h3></h3>
          </div>
          <div class="score-badge"></div>
        </div>
        <div class="job-meta"></div>
        <p class="reason"></p>
        <div class="skill-row"></div>
        <div class="card-footer">
          <span class="salary"></span>
          <button type="button">查看详情</button>
        </div>
      </article>
    </template>

    <dialog id="jobDetailDialog" class="detail-dialog">
      <button id="closeDetail" class="icon-button" type="button" aria-label="关闭详情">×</button>
      <div id="detailBody"></div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
